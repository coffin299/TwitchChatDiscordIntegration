# ============================================================
# よく来る人・語句の読み替え辞書
#   config.yaml と同じフォルダに置きます。このファイルを dictionary.yaml
#   にコピーするか、Discord の /dictionary add で作成できます。
#   users のキーは Discord ユーザー ID（その人の配信コメントに使います）。
#   各項目は「Twitchのログイン名または表示名: 読み上げるよみ」です。
#   名前はログイン名か表示名が一致したときその読みになり、
#   コメント本文に同じ語句があればそこも置き換えます。
# ============================================================

users:
  111111111111111111:
    someviewer: サムビューアー
    "FriendName": ふれんど
